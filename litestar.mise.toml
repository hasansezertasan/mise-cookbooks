min_version = "2024.9.5"

[env]
PROJECT_NAME = "{{ config_root | basename }}"
LITESTAR_APP = "app.main:app"
HOST = "127.0.0.1"
PORT = "8000"

# Automatic virtualenv activation
_.python.venv = { path = ".venv", create = true }

[tools]
python = "{{ get_env(name='PYTHON_VERSION', default='3.11') }}"
uv = "latest"
ruff = "latest"

[tasks.install]
description = "Install dependencies"
alias = "i"
run = "uv pip install -r requirements.txt"

[tasks.server]
description = "Run the development server with auto-reload"
alias = "s"
run = "litestar run --reload --host $HOST --port $PORT"

[tasks.run]
description = "Run the production server"
alias = "r"
run = "litestar run --host $HOST --port $PORT"

[tasks.routes]
description = "List all routes"
run = "litestar routes"

[tasks.openapi]
description = "Export OpenAPI schema"
run = "litestar schema openapi --output openapi.json"

[tasks.test]
description = "Run tests"
alias = "t"
run = "pytest tests/"

[tasks."test:coverage"]
description = "Run tests with coverage"
run = "pytest tests/ --cov=app --cov-report=html"

[tasks.lint]
description = "Lint the code"
alias = "l"
run = "ruff check ."

[tasks.format]
description = "Format the code"
alias = "f"
run = "ruff format ."

[tasks.ci]
description = "Run all checks (lint, test)"
depends = ["lint", "test"]

[tasks.info]
description = "Print project information"
run = '''
echo "Project: $PROJECT_NAME"
echo "App: $LITESTAR_APP"
echo "Virtual Environment: $VIRTUAL_ENV"
echo "Python: $(python --version)"
python -c "import litestar; print(f'Litestar: {litestar.__version__}')" 2>/dev/null || echo "Litestar: not installed"
'''
