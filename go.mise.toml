# min_version 2025.2.5 is required for `outputs = { auto = true }`, which lets
# mise skip build/test/lint tasks when none of their Go sources have changed.
min_version = "2025.2.5"

[env]
PROJECT_NAME = "{{ config_root | basename }}"
BUILD_DIR = "bin"
CGO_ENABLED = "0"

[tools]
go = "{{ get_env(name='GO_VERSION', default='1.22') }}"
golangci-lint = "latest"

[tasks.install]
description = "Download module dependencies"
alias = "i"
run = "go mod download"

# If your build embeds non-Go assets via `//go:embed`, add their globs to
# `sources` below (e.g. "templates/**/*") so a changed asset invalidates the
# cache and triggers a rebuild.
[tasks.build]
description = "Build the application"
alias = "b"
run = "go build -o $BUILD_DIR/$PROJECT_NAME ."
sources = ["go.mod", "go.sum", "**/*.go"]
outputs = { auto = true }

[tasks."build:release"]
description = "Build the application with optimizations"
run = "go build -ldflags='-s -w' -o $BUILD_DIR/$PROJECT_NAME ."
sources = ["go.mod", "go.sum", "**/*.go"]
outputs = { auto = true }

[tasks.run]
description = "Run the application"
alias = "r"
run = "go run ."

[tasks.generate]
description = "Run go:generate directives"
alias = "g"
run = "go generate ./..."
sources = ["go.mod", "go.sum", "**/*.go"]
outputs = { auto = true }

[tasks.test]
description = "Run tests"
alias = "t"
run = "go test -shuffle=on ./..."
sources = ["go.mod", "go.sum", "**/*.go"]
outputs = { auto = true }

[tasks."test:coverage"]
description = "Run tests with coverage"
run = "go test -cover ./..."

[tasks.lint]
description = "Lint the code"
alias = "l"
run = "golangci-lint run"
sources = ["go.mod", "go.sum", "**/*.go"]
outputs = { auto = true }

[tasks.fix]
description = "Fix as many lint errors as possible"
run = "golangci-lint run --fix"

[tasks.vet]
description = "Run go vet for static analysis"
run = "go vet ./..."
sources = ["go.mod", "go.sum", "**/*.go"]
outputs = { auto = true }

[tasks."mod:check"]
description = "Verify modules are downloaded, tidy, and reproducible"
run = [
  "go mod verify",
  "go mod download",
  "go mod tidy",
  # Fail on modified tracked files (diff) and on untracked go.mod/go.sum
  # (e.g. a go.sum created by `go mod tidy` but never committed, which a
  # plain `git diff` would silently ignore).
  "git diff --exit-code -- go.mod go.sum",
  "test -z \"$(git ls-files --others --exclude-standard -- go.mod go.sum)\"",
]

[tasks.ci]
description = "Run all checks (mod:check, lint, vet, test)"
depends = ["mod:check", "lint", "vet", "test"]

[tasks.format]
description = "Format the code"
alias = "f"
run = "go fmt ./..."

[tasks.tidy]
description = "Tidy module dependencies"
run = "go mod tidy"

[tasks.clean]
description = "Clean build artifacts"
alias = "c"
run = "rm -rf \"$BUILD_DIR\""

[tasks.info]
description = "Print project information"
run = '''
echo "Project: $PROJECT_NAME"
echo "Go Version: $(go version)"
echo "Module: $(go list -m)"
'''
